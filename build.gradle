plugins {
    id 'java'
    id 'application'  // добавляем плагин
}

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation("com.google.apis:google-api-services-youtube:v3-rev20250128-2.0.0")
    implementation("com.google.http-client:google-http-client-jackson2:1.42.3")
    implementation 'org.postgresql:postgresql:42.7.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.telegram:telegrambots-longpolling:9.5.0'
    implementation 'org.telegram:telegrambots-client:9.5.0'
}

application {
    mainClass = 'videostats.VideoStatsAggregator'
}
test {
    useJUnit()
}
