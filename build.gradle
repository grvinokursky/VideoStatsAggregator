plugins {
    id 'java'
    id 'application'
}

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

def hibernateVersion = "7.3.1.Final"

dependencies {
    implementation 'com.google.apis:google-api-services-youtube:v3-rev20250128-2.0.0'
    implementation 'com.google.http-client:google-http-client-jackson2:1.42.3'
    implementation 'org.postgresql:postgresql:42.7.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.telegram:telegrambots-longpolling:9.5.0'
    implementation 'org.telegram:telegrambots-client:9.5.0'

    implementation("org.hibernate.orm:hibernate-core:$hibernateVersion")
    implementation("org.postgresql:postgresql:42.7.3")
    annotationProcessor("org.hibernate.orm:hibernate-processor:$hibernateVersion")
    testImplementation("org.hibernate.orm:hibernate-testing:$hibernateVersion")
    testImplementation("org.junit.jupiter:junit-jupiter:5.10.0")
    implementation 'org.jboss.narayana.jta:narayana-jta:6.0.0.Final'
}

application {
    mainClass = 'videostats.VideoStatsAggregator'
}

jar {
    manifest {
        attributes 'Main-Class': 'videostats.VideoStatsAggregator'
    }
    from {
        configurations.runtimeClasspath.collect { 
            it.isDirectory() ? it : zipTree(it) 
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

test {
    useJUnit()
}
